<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다수 필지 공시지가 자동조회 (Vercel Proxy)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas CDN (이미지 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4 py-8">

    <div class="max-w-6xl mx-auto px-4">
        <header class="mb-6 text-center">
            <span class="text-xs font-semibold tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase">CORS 우회 적용 완료</span>
            <h1 class="text-2xl font-bold mt-2">다수 필지 공시지가 합산 시스템</h1>
            <p class="text-sm text-slate-500 mt-1">Vercel API Route를 통해 브이월드 데이터를 안전하게 불러옵니다.</p>
        </header>

        <div id="capture-area" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
            
            <!-- 필지 주소 입력 폼 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-3">
                <h2 class="text-sm font-semibold text-slate-700">필지 정보 조회 (법정동 코드 10자리 + 지번)</h2>
                <div class="flex gap-2">
                    <input type="text" id="input-address" placeholder="예: 1168010100 (PNU 코드 일부 입력)" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="addParcel()" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors whitespace-nowrap">
                        + 조회 및 추가
                    </button>
                </div>
            </div>

            <!-- 필지 목록 테이블 -->
            <div>
                <h3 class="text-sm font-semibold text-slate-700 mb-2">등록된 필지 목록</h3>
                <div class="overflow-x-auto border border-slate-200 rounded-xl">
                    <table class="w-full text-left border-collapse text-xs sm:text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase tracking-wider">
                                <th class="p-3">PNU/주소 식별자</th>
                                <th class="p-3">면적 (㎡)</th>
                                <th class="p-3">공시단가 (원/㎡)</th>
                                <th class="p-3">토지 공시가격 합계</th>
                                <th class="p-3 text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="parcel-table-body" class="divide-y divide-slate-200">
                            <tr id="empty-row">
                                <td colspan="5" class="p-6 text-center text-slate-400">등록된 필지가 없습니다. PNU 등 식별 코드를 입력해 주세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 합산 결과 요약 카드 -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 space-y-3">
                <h3 class="text-sm font-bold text-blue-900">📊 종합 합산 결과</h3>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <span class="text-slate-500 block text-xs">총 토지 면적</span>
                        <span id="total-area" class="font-bold text-slate-800 text-base">0 ㎡</span>
                        <span id="total-pyeong" class="text-xs text-slate-500 block">(0.00 평)</span>
                    </div>
                    <div>
                        <span class="text-slate-500 block text-xs">총 공시지가 합계</span>
                        <span id="total-price" class="font-bold text-blue-600 text-lg">0 원</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 액션 버튼 -->
        <div class="mt-4 flex gap-3">
            <button onclick="downloadImage()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-3 rounded-xl transition-colors shadow-sm">
                📷 결과 화면 이미지로 저장
            </button>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let parcels = [];

        async function fetchLandDataViaProxy(address) {
            // Vercel 배포 환경에서 작동하는 API 프록시 호출!
            // 브라우저는 /api/vworld (같은 도메인)로 요청하므로 CORS 발생 불가
            const response = await fetch(`/api/vworld?address=${encodeURIComponent(address)}`);
            
            if (!response.ok) {
                throw new Error('API 요청 실패');
            }
            const data = await response.json();
            
            // 주의: 아래 파싱 로직은 V-World 응답 구조에 맞게 수정이 필요합니다.
            // 임시로 응답 데이터가 있다고 가정하고 하드코딩 매핑합니다.
            console.log("Vworld Data:", data);
            
            // 실제 응답값 추출 예시 (브이월드 매뉴얼 참고하여 수정 필요)
            // const feature = data.response.result.featureCollection.features[0].properties;
            // return { area: feature.parea, price: feature.pnnlp };
            
            // (데모 작동을 위한 임시 반환값)
            return {
                area: Math.floor(Math.random() * 100) + 50, 
                price: Math.floor(Math.random() * 5 + 1) * 100000 
            };
        }

        async function addParcel() {
            const addressInput = document.getElementById('input-address');
            const submitBtn = document.getElementById('submit-btn');
            const address = addressInput.value.trim();

            if (!address) {
                alert('조회할 주소나 코드를 입력해 주세요.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '조회 중...';

            try {
                // 프록시 API 호출 대기
                const landData = await fetchLandDataViaProxy(address);

                const newParcel = {
                    id: Date.now(),
                    address,
                    area: landData.area,
                    price: landData.price
                };

                parcels.push(newParcel);
                addressInput.value = '';
                renderTable();
                updateSummary();
            } catch (error) {
                alert('데이터를 불러오는 중 오류가 발생했습니다.');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '+ 조회 및 추가';
            }
        }

        function removeParcel(id) {
            parcels = parcels.filter(p => p.id !== id);
            renderTable();
            updateSummary();
        }

        function renderTable() {
            const tbody = document.getElementById('parcel-table-body');
            
            if (parcels.length === 0) {
                tbody.innerHTML = `<tr id="empty-row"><td colspan="5" class="p-6 text-center text-slate-400">등록된 필지가 없습니다. PNU 등 식별 코드를 입력해 주세요.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            parcels.forEach(parcel => {
                const totalPrice = parcel.area * parcel.price;
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td class="p-3 font-medium">${parcel.address}</td>
                    <td class="p-3">${parcel.area.toLocaleString()} ㎡</td>
                    <td class="p-3">${parcel.price.toLocaleString()} 원</td>
                    <td class="p-3 font-semibold text-slate-900">${totalPrice.toLocaleString()} 원</td>
                    <td class="p-3 text-center">
                        <button onclick="removeParcel(${parcel.id})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateSummary() {
            const totalArea = parcels.reduce((sum, p) => sum + p.area, 0);
            const totalPrice = parcels.reduce((sum, p) => sum + (p.area * p.price), 0);
            const totalPyeong = totalArea / 3.305785;

            document.getElementById('total-area').innerText = `${totalArea.toLocaleString()} ㎡`;
            document.getElementById('total-pyeong').innerText = `(${totalPyeong.toFixed(2)} 평)`;
            document.getElementById('total-price').innerText = `${totalPrice.toLocaleString()} 원`;
        }

        function downloadImage() {
            const target = document.getElementById('capture-area');
            html2canvas(target, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = '토지합산_공시지가_분석결과.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
