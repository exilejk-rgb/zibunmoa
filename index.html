<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>다수 필지 공시지가 자동조회</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>


<body class="bg-slate-50 text-slate-800 py-8">

<div class="max-w-6xl mx-auto px-4">

    <!-- HEADER -->
    <header class="mb-6 text-center">

        <span
            class="text-xs font-semibold tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full">

            V-WORLD 실데이터 조회

        </span>

        <h1 class="text-2xl font-bold mt-2">

            다수 필지 공시지가 합산 시스템

        </h1>

        <p class="text-sm text-slate-500 mt-1">

            V-WORLD API에서 실제 토지정보를 조회하여 필지별 공시지가를 합산합니다.

        </p>

    </header>


    <!-- MAIN -->
    <div
        id="capture-area"
        class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">


        <!-- INPUT -->
        <div
            class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-3">

            <h2 class="text-sm font-semibold text-slate-700">

                필지 정보 조회

            </h2>


            <p class="text-xs text-slate-500">

                PNU 19자리를 입력하세요.
                예) 1111010100100010001

            </p>


            <div class="flex gap-2">

                <input
                    type="text"
                    id="input-pnu"
                    placeholder="예: 1111010100100010001"
                    class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onkeydown="if(event.key === 'Enter') addParcel()"
                >


                <button
                    onclick="addParcel()"
                    id="submit-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors whitespace-nowrap">

                    + 조회 및 추가

                </button>

            </div>


            <!-- STATUS -->

            <div
                id="status-message"
                class="hidden text-xs rounded-lg px-3 py-2">
            </div>

        </div>


        <!-- TABLE -->

        <div>

            <div class="flex justify-between items-center mb-2">

                <h3 class="text-sm font-semibold text-slate-700">

                    등록된 필지 목록

                </h3>


                <span
                    id="parcel-count"
                    class="text-xs text-slate-400">

                    0필지

                </span>

            </div>


            <div
                class="overflow-x-auto border border-slate-200 rounded-xl">

                <table
                    class="w-full text-left border-collapse text-xs sm:text-sm">

                    <thead>

                    <tr
                        class="bg-slate-100 text-slate-600">

                        <th class="p-3">
                            PNU
                        </th>

                        <th class="p-3">
                            면적
                        </th>

                        <th class="p-3">
                            기준연도
                        </th>

                        <th class="p-3">
                            공시지가
                        </th>

                        <th class="p-3">
                            토지 공시가격
                        </th>

                        <th class="p-3 text-center">
                            관리
                        </th>

                    </tr>

                    </thead>


                    <tbody
                        id="parcel-table-body"
                        class="divide-y divide-slate-200">

                    <tr id="empty-row">

                        <td
                            colspan="6"
                            class="p-6 text-center text-slate-400">

                            등록된 필지가 없습니다.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- SUMMARY -->

        <div
            class="bg-blue-50 border border-blue-100 rounded-xl p-5 space-y-3">

            <h3 class="text-sm font-bold text-blue-900">

                📊 종합 합산 결과

            </h3>


            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">


                <div>

                    <span class="text-slate-500 block text-xs">
                        총 필지
                    </span>

                    <span
                        id="total-count"
                        class="font-bold text-slate-800 text-base">

                        0 필지

                    </span>

                </div>


                <div>

                    <span class="text-slate-500 block text-xs">
                        총 토지 면적
                    </span>

                    <span
                        id="total-area"
                        class="font-bold text-slate-800 text-base">

                        0 ㎡

                    </span>

                    <span
                        id="total-pyeong"
                        class="text-xs text-slate-500 block">

                        (0.00 평)

                    </span>

                </div>


                <div>

                    <span class="text-slate-500 block text-xs">
                        총 공시지가 기준금액
                    </span>

                    <span
                        id="total-price"
                        class="font-bold text-blue-600 text-lg">

                        0 원

                    </span>

                </div>

            </div>

        </div>


    </div>


    <!-- BUTTON -->

    <div class="mt-4 flex gap-3">

        <button
            onclick="downloadImage()"
            class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-3 rounded-xl transition-colors shadow-sm">

            📷 결과 화면 이미지로 저장

        </button>


        <button
            onclick="clearAll()"
            class="px-6 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium py-3 rounded-xl transition-colors">

            전체 삭제

        </button>

    </div>


</div>


<script>

    let parcels = [];


    // --------------------------------------------------
    // 숫자 포맷
    // --------------------------------------------------

    function numberFormat(value) {

        return Number(value || 0).toLocaleString("ko-KR");

    }


    // --------------------------------------------------
    // PNU 정리
    // --------------------------------------------------

    function normalizePnu(value) {

        return String(value || "")
            .replace(/\D/g, "");

    }


    // --------------------------------------------------
    // V-WORLD API 호출
    // --------------------------------------------------

    async function fetchLandData(pnu) {

        const response = await fetch(
            `/api/vworld?pnu=${encodeURIComponent(pnu)}`
        );


        let data;

        try {

            data = await response.json();

        } catch (error) {

            throw new Error(
                "V-WORLD 서버 응답을 읽을 수 없습니다."
            );

        }


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "V-WORLD 데이터 조회에 실패했습니다."
            );

        }


        return data;

    }


    // --------------------------------------------------
    // 필지 추가
    // --------------------------------------------------

    async function addParcel() {

        const input =
            document.getElementById("input-pnu");

        const button =
            document.getElementById("submit-btn");


        const rawValue =
            input.value.trim();


        if (!rawValue) {

            showStatus(
                "조회할 PNU를 입력해 주세요.",
                "error"
            );

            return;

        }


        const pnu =
            normalizePnu(rawValue);


        if (pnu.length !== 19) {

            showStatus(
                `PNU는 19자리여야 합니다. 현재 ${pnu.length}자리입니다.`,
                "error"
            );

            return;

        }


        // 중복 확인

        if (parcels.some(p => p.pnu === pnu)) {

            showStatus(
                "이미 등록된 필지입니다.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.innerText = "V-WORLD 조회 중...";


        showStatus(
            "V-WORLD에서 실제 토지정보를 조회하고 있습니다.",
            "loading"
        );


        try {

            const data =
                await fetchLandData(pnu);


            const parcel = {

                id: Date.now(),

                pnu: data.pnu,

                area: Number(data.area),

                price: Number(data.price),

                year: data.year,

                totalPrice: Number(data.totalPrice),

                queriedAt: data.queriedAt

            };


            parcels.push(parcel);


            input.value = "";


            renderTable();

            updateSummary();


            showStatus(
                `조회 완료 · V-WORLD ${data.year}년 기준`,
                "success"
            );


        } catch (error) {

            console.error(error);


            showStatus(
                error.message,
                "error"
            );


        } finally {

            button.disabled = false;

            button.innerText =
                "+ 조회 및 추가";

        }

    }


    // --------------------------------------------------
    // 테이블 출력
    // --------------------------------------------------

    function renderTable() {

        const tbody =
            document.getElementById(
                "parcel-table-body"
            );


        const count =
            document.getElementById(
                "parcel-count"
            );


        count.innerText =
            `${parcels.length}필지`;


        if (parcels.length === 0) {

            tbody.innerHTML = `

                <tr id="empty-row">

                    <td
                        colspan="6"
                        class="p-6 text-center text-slate-400">

                        등록된 필지가 없습니다.

                    </td>

                </tr>

            `;

            return;

        }


        tbody.innerHTML = "";


        parcels.forEach(parcel => {

            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td class="p-3 font-medium">

                    ${parcel.pnu}

                </td>


                <td class="p-3">

                    ${numberFormat(parcel.area)} ㎡

                </td>


                <td class="p-3">

                    ${parcel.year}

                </td>


                <td class="p-3">

                    ${numberFormat(parcel.price)} 원/㎡

                </td>


                <td class="p-3 font-semibold text-slate-900">

                    ${numberFormat(parcel.totalPrice)} 원

                </td>


                <td class="p-3 text-center">

                    <button

                        onclick="removeParcel(${parcel.id})"

                        class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">

                        삭제

                    </button>

                </td>

            `;


            tbody.appendChild(tr);

        });

    }


    // --------------------------------------------------
    // 필지 삭제
    // --------------------------------------------------

    function removeParcel(id) {

        parcels =
            parcels.filter(
                parcel => parcel.id !== id
            );


        renderTable();

        updateSummary();

    }


    // --------------------------------------------------
    // 합산
    // --------------------------------------------------

    function updateSummary() {

        const totalArea =
            parcels.reduce(
                (sum, parcel) =>
                    sum + parcel.area,
                0
            );


        const totalPrice =
            parcels.reduce(
                (sum, parcel) =>
                    sum + parcel.totalPrice,
                0
            );


        const totalPyeong =
            totalArea / 3.305785;


        document.getElementById(
            "total-count"
        ).innerText =
            `${parcels.length} 필지`;


        document.getElementById(
            "total-area"
        ).innerText =
            `${numberFormat(totalArea)} ㎡`;


        document.getElementById(
            "total-pyeong"
        ).innerText =
            `(${totalPyeong.toFixed(2)} 평)`;


        document.getElementById(
            "total-price"
        ).innerText =
            `${numberFormat(totalPrice)} 원`;

    }


    // --------------------------------------------------
    // 상태 메시지
    // --------------------------------------------------

    function showStatus(message, type) {

        const box =
            document.getElementById(
                "status-message"
            );


        box.classList.remove(
            "hidden",
            "bg-red-50",
            "text-red-700",
            "bg-green-50",
            "text-green-700",
            "bg-blue-50",
            "text-blue-700"
        );


        if (type === "error") {

            box.classList.add(
                "bg-red-50",
                "text-red-700"
            );

        } else if (type === "success") {

            box.classList.add(
                "bg-green-50",
                "text-green-700"
            );

        } else {

            box.classList.add(
                "bg-blue-50",
                "text-blue-700"
            );

        }


        box.innerText = message;

    }


    // --------------------------------------------------
    // 전체 삭제
    // --------------------------------------------------

    function clearAll() {

        if (parcels.length === 0) {

            return;

        }


        if (
            !confirm(
                "등록된 모든 필지를 삭제하시겠습니까?"
            )
        ) {

            return;

        }


        parcels = [];


        renderTable();

        updateSummary();


        showStatus(
            "전체 필지를 삭제했습니다.",
            "success"
        );

    }


    // --------------------------------------------------
    // 이미지 저장
    // --------------------------------------------------

    function downloadImage() {

        const target =
            document.getElementById(
                "capture-area"
            );


        html2canvas(
            target,
            {
                scale: 2,
                backgroundColor: "#ffffff"
            }
        )
        .then(canvas => {

            const link =
                document.createElement("a");


            link.download =
                "토지합산_공시지가_분석결과.png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        });

    }


    // --------------------------------------------------
    // 초기화
    // --------------------------------------------------

    renderTable();

    updateSummary();

</script>


</body>

</html>
